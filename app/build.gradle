plugins {
    id 'com.android.application'
}

android {
    namespace 'com.hentaila.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.hentaila.tv"
        minSdk 24
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    // Firma con tu debug.keystore (si no coincide la contraseña, borra este bloque
    // y la línea signingConfig de buildTypes: usará la firma debug por defecto)
    signingConfigs {
        debug {
            storeFile rootProject.file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
